[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
verbosity = 3

# Monad 测试网部署：环境变量从 backend/.env 或 CI secrets 注入
# forge script script/Deploy.s.sol --rpc-url $RPC_URL_TESTNET --broadcast --legacy --account <cast-wallet>
[rpc_endpoints]
monad_testnet = "${RPC_URL_TESTNET}"

# Monadscan（Etherscan 风格）源码验证
[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://testnet.monadscan.com/api" }
